version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: student_management_pg
    environment:
      POSTGRES_DB: ${DB_NAME:-student_management_db}
      POSTGRES_USER: ${DB_USER:-student_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-student_secret_change_in_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-student_admin} -d ${DB_NAME:-student_management_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_management_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_NAME: ${DB_NAME:-student_management_db}
      DB_USER: ${DB_USER:-student_admin}
      DB_PASSWORD: ${DB_PASSWORD:-student_secret_change_in_prod}
      DB_PORT: 5432
      DB_CONN_MAX_AGE: 600
      SECRET_KEY: ${SECRET_KEY:-insecure-prod-key-please-replace-in-env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,nginx,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 config.wsgi:application"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_management_ui
    restart: always

  nginx:
    image: nginx:alpine
    container_name: student_management_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  pgdata:
  static_volume:
  media_volume:
